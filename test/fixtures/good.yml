name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
      - name: Deploy token check
        run: echo "token present"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
